name: APK fordítás

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK fordítása
        run: gradle assembleRelease --no-daemon

      - name: APK átnevezése
        run: cp app/build/outputs/apk/release/app-release.apk navi-indito.apk

      - uses: actions/upload-artifact@v4
        with:
          name: navi-indito
          path: navi-indito.apk

      - name: Kiadás (letölthető link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Navi indító ${{ github.run_number }}
          files: navi-indito.apk
          make_latest: true
