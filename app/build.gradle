plugins {
    id 'com.android.application'
}

android {
    namespace 'hu.gordosmiki.naviindito'
    compileSdk 34

    defaultConfig {
        applicationId 'hu.gordosmiki.naviindito'
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName '0.7'
    }

    // Fix aláíró kulcs: így az újabb verziók a régire rátelepíthetők.
    signingConfigs {
        fix {
            storeFile file('navi-indito.keystore')
            storePassword 'naviindito'
            keyAlias 'navi'
            keyPassword 'naviindito'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fix
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fix
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
